<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audem voces</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens de web/src/comun.css (DESIGN.md): fondo blanco, tono pos/neu/neg, Poppins + IBM Plex Mono. */
  :root { color-scheme:light; --bg:#ffffff; --line:#cfdde1; --dot:#fff; --ink:#24292b; --soft:#5f6669; --coral:#ec5449; --card:#ffffff;
          --t-neg:#ec5449; --t-neu:#eab54e; --t-pos:#16a8c0; --accent-ink:#0b7f96;
          --iris:linear-gradient(100deg,#ffe6a0 0%,#f6866f 18%,#ec5449 32%,#5fe0cf 55%,#14b4c9 70%,#0f7fae 84%,#b4a2ec 100%); }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; font-family:"Poppins",system-ui,sans-serif; color:var(--ink); }
  body::before { content:""; position:fixed; inset:0 0 auto; height:5px; background:var(--iris); z-index:10; }
  .num { font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  #stage { position:fixed; inset:0; }
  svg { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; user-select:none; }
  svg text { font-size:13px; fill:var(--soft); transition:fill .3s; }
  svg text.on { fill:var(--accent-ink); font-weight:600; }
  .op { pointer-events:all; cursor:pointer; stroke:var(--card); stroke-width:1.5; transition:opacity .4s, r .2s; }
  .op.dim { opacity:.18; }
  .op.sel { stroke:var(--ink); stroke-width:2; }
  .thread { fill:none; stroke:var(--accent-ink); stroke-width:1.5; opacity:.7; stroke-dasharray:1; animation:draw 1.2s ease-out forwards; }
  @keyframes draw { from { stroke-dashoffset:1; } to { stroke-dashoffset:0; } }
  header { position:fixed; top:16px; left:16px; right:16px; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header p { margin:2px 0 0; font-size:13px; color:var(--soft); }
  .k { display:inline-block; width:10px; height:10px; border-radius:50%; margin:0 3px 0 8px; vertical-align:0; }
  #card { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); width:min(560px, calc(100% - 32px));
          box-sizing:border-box; background:var(--card); border-radius:14px; padding:14px 16px;
          box-shadow:0 30px 60px -36px rgba(16,120,145,.45), 0 2px 10px rgba(16,100,120,.07); max-height:34vh; overflow:auto; }
  #tag { display:inline-block; font-size:13px; font-weight:500; color:var(--accent-ink); }
  #who { font-size:13px; color:var(--soft); margin-top:4px; }
  #who b { color:var(--ink); font-size:16px; }
  #quote { font-size:16px; line-height:1.4; margin:6px 0 10px; }
  #bar { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--soft); }
  #bar button { border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:8px; padding:4px 10px; cursor:pointer; font:inherit; }
  #bar button[hidden] { display:none; }
  #prog { flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
  #prog i { display:block; height:100%; width:0; background:var(--accent-ink); transition:width .4s; }
</style>
</head>
<body>
<div id="stage"></div>
<svg id="ui"><g id="threads"></g></svg>
<header>
  <h1>Voces de la hackathon</h1>
  <p>Datos sintéticos · <span class="num">Casos: 25</span> personas · cada punto es una persona (tócalo para leerla)<br>
     tono:<span class="k" style="background:var(--t-pos)"></span>positivo<span class="k" style="background:var(--t-neu)"></span>neutro<span class="k" style="background:var(--t-neg)"></span>negativo</p>
</header>
<div id="card">
  <span id="tag"></span>
  <div id="who"></div>
  <div id="quote"></div>
  <div id="bar">
    <button id="prev" hidden aria-label="Anterior">‹</button>
    <span id="count" class="num">0/25</span><div id="prog"><i></i></div>
    <button id="next" hidden aria-label="Siguiente">›</button>
    <button id="toggle">Pausa</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Datos ----------
// Orden de ejes: 0 arriba, luego antihorario (1 arriba-izq … 5 arriba-der)
const TEMAS       = ['Evaluación', 'Inclusión', 'Logística', 'Formato e IA', 'Legado y auspicios', 'Equipos y mentores'];
const TEMAS_CORTO = ['Evaluación', 'Inclusión', 'Logística', 'Formato', 'Legado', 'Equipos'];
const E = 0, INC = 1, LOG = 2, FOR = 3, LEG = 4, EQ = 5;
const C = 'neg', M = 'neu', P = 'pos';                    // tono (DESIGN.md): negativo / neutro / positivo
const OPINIONES = [
  [1,  'Camila, backend, primera hackathon', LOG, M, 'Mentores buenísimos, pero sin un lugar para dormir el pitch del domingo salió pésimo.'],
  [2,  'Rodrigo, ingeniero senior', E, C, 'Tres minutos de jurado premian la mejor lámina, no lo que más se construyó.'],
  [3,  'Fernanda, diseñadora de producto', FOR, M, 'Con agentes, el cuello de botella es decidir qué construir. La rúbrica no ve el diseño.'],
  [4,  'Matías, estudiante de ingeniería', INC, C, 'Se acabaron los créditos y la competencia pasó a depender de cuánta plata tenía cada equipo.'],
  [5,  'Valentina, fundadora de startup', LEG, P, 'Excelente. Faltó una hora al final para probar proyectos y conocer a la gente.'],
  [6,  'Ignacio, hardware', FOR, M, 'Hardware con las mismas 36 horas: un sensor quemado son tres horas perdidas.'],
  [7,  'Paula, product manager', EQ, C, 'Dos mentores, dos lecturas opuestas del track. Seis horas perdidas.'],
  [8,  'Sebastián, viajó desde Concepción', INC, M, 'Sin conocer a nadie ni ayuda para el pasaje. Casi todos eran de Santiago.'],
  [9,  'Antonia, investigadora en IA', E, M, 'Muchos proyectos ya existían. ¿Cómo se evalúa originalidad sin revisar antecedentes?'],
  [10, 'Cristóbal, frontend', LOG, P, 'Frío de noche, calor de tarde, y sin café de cuatro a siete de la mañana.'],
  [11, 'Javiera, ingeniera de datos, madre de dos', INC, C, 'El formato asume que puedes desaparecer 36 horas. Filtra a quienes cuidan.'],
  [12, 'Tomás, full stack', FOR, M, 'Si el código lo escribe el agente, lo que hay que evaluar es el criterio.'],
  [13, 'Daniela, abogada', INC, M, 'Avisos solo por Discord, jerga en inglés, y su aporte legal no cuenta en la evaluación.'],
  [14, 'Felipe, finalista', E, C, 'La final en escenario castiga lo multiusuario: terminamos mostrando un video.'],
  [15, 'Constanza, mentora', EQ, M, 'Mentores sin pauta común. Avanzaron los que decidieron rápido y no volvieron atrás.'],
  [16, 'Nicolás, desarrollador móvil', LOG, C, 'Marcó vegetariano al inscribirse y aun así no hubo comida para él.'],
  [17, 'Isidora, estudiante de diseño', INC, M, 'Espacio muy masculino, y nadie identificable a quien acudir de madrugada.'],
  [18, 'Andrés, CTO', LEG, P, 'Los auspiciadores deberían traer problemas reales, con datos y alguien que responda.'],
  [19, 'Catalina, equipo que no terminó', EQ, M, 'Tres cambios de idea, cero entrega, mucho aprendizaje.'],
  [20, 'Benjamín, seguridad', LEG, C, 'Claves en canales abiertos: la hackathon normaliza malas prácticas que vuelven al trabajo.'],
  [21, 'Rosario, llegó sola', EQ, M, 'El armado de equipos fue corto y ruidoso, pero su equipo de "sobrantes" decidió en una hora.'],
  [22, 'Gabriel, escéptico', LEG, C, 'Dos horas de charlas de auspiciadores antes de empezar. Cada año más feria.'],
  [23, 'Emilia, científica de datos', E, C, 'Rúbrica sin definición de niveles y ni un puntaje de vuelta.'],
  [24, 'Vicente, ganador de un track', E, P, 'Ganamos por decidir el viernes y no tocar más la idea.'],
  [25, 'Loreto, sector público', LEG, C, 'Al mes no queda nada: falta una galería pública y seguimiento.'],
];
const byTema = t => OPINIONES.filter(o => o[2] === t).map(o => o[0]);
// Cada lectura resalta opiniones (ids), y si link=true las une con hilos
const LECTURAS = [
  { t:'Tres focos empatan', axes:[E, INC, LEG], ids:[...byTema(E), ...byTema(INC), ...byTema(LEG)],
    d:'Evaluación, inclusión y legado suman 5 opiniones cada uno. Las quejas apuntan al diseño del evento, no a su ejecución.' },
  { t:'Decidir temprano y no volver atrás', link:true, ids:[15, 24, 21, 5, 19, 7],
    d:'Cruza tres temas. Constanza, Vicente, Rosario y Valentina lo ven como la clave. Catalina y Paula muestran el costo: mentores y tracks contradictorios provocan cambios de idea.' },
  { t:'El trabajo cambió, el formato no', link:true, ids:[12, 3, 2, 23, 14],
    d:'Con agentes, el valor está en el criterio (Tomás, Fernanda), pero el pitch de 3 minutos, una rúbrica sin niveles y una final en escenario no lo capturan.' },
  { t:'El formato filtra', link:true, ids:[4, 8, 11, 13, 17],
    d:'Plata para tokens, viajar desde regiones, cuidar hijos, no ser técnico, ser mujer. La sala termina joven, de Santiago y masculina.' },
  { t:'Lo logístico es barato de arreglar', link:true, ids:[1, 10, 16],
    d:'Sala oscura para dormir, comida separada por nombre, café de madrugada, clima.' },
  { t:'Crítica, pero constructiva', tone:true, ids:OPINIONES.map(o => o[0]),
    d:'10 negativas, 11 neutras, 4 positivas. Casi todas traen una propuesta concreta y varias dicen que volverían: la molestia es con el modelo, no con quienes organizan.' },
];

// ---------- Three.js ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.z = 6;

const dirs = [...Array(6)].map((_, i) => {
  const a = Math.PI / 2 + i * Math.PI / 3;
  return new THREE.Vector3(Math.cos(a), Math.sin(a), 0.35).normalize();
});

const uniforms = {
  uTime:  { value: 0 },
  uDirs:  { value: dirs },
  uVals:  { value: [0, 0, 0, 0, 0, 0] },
  uPulse: { value: [0, 0, 0, 0, 0, 0] },
  uAmp:   { value: 0.03 },
  uMouse: { value: new THREE.Vector3(0, 0, 1) },
  uPull:  { value: 0 },
};

// Simplex noise 3D (Ashima Arts / Stefan Gustavson, MIT)
const noise = `
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

const vertexShader = noise + `
uniform float uTime; uniform vec3 uDirs[6]; uniform float uVals[6]; uniform float uPulse[6];
uniform float uAmp; uniform vec3 uMouse; uniform float uPull;
varying vec3 vN; varying float vD; varying vec3 vView;

float disp(vec3 p){
  float d = snoise(p * 1.2 + uTime * 0.08) * uAmp;
  d += snoise(p * 2.2 - uTime * 0.1) * uAmp * 0.2;
  for(int i=0;i<6;i++){
    float k = pow(max(dot(p, uDirs[i]), 0.), 5.);
    d += k * uVals[i] * (0.45 + 0.08 * snoise(p * 2.5 + float(i) + uTime * 0.15));
    d += k * uPulse[i] * 0.12;
  }
  d += pow(max(dot(p, uMouse), 0.), 8.) * uPull * 0.12;
  return d;
}
vec3 move(vec3 p){ return p * (1. + disp(p)); }

void main(){
  vec3 p = normalize(position);
  vec3 t = normalize(cross(p, abs(p.y) < .99 ? vec3(0,1,0) : vec3(1,0,0)));
  vec3 b = cross(p, t);
  float e = 0.01;
  vec3 P = move(p), A = move(normalize(p + t*e)), B = move(normalize(p + b*e));
  vN = normalize(normalMatrix * cross(A - P, B - P));
  vD = disp(p);
  vec4 mv = modelViewMatrix * vec4(P, 1.);
  vView = normalize(-mv.xyz);
  gl_Position = projectionMatrix * mv;
}`;

const fragmentShader = `
varying vec3 vN; varying float vD; varying vec3 vView;
void main(){
  vec3 coral = vec3(0.925, 0.329, 0.286);   // --neg #ec5449
  vec3 cyan  = vec3(0.086, 0.659, 0.753);   // --pos #16a8c0
  vec3 cream = vec3(1.0, 0.97, 0.92);
  float fres = pow(1. - max(dot(vN, vView), 0.), 2.);
  float diff = max(dot(vN, normalize(vec3(-.4,.6,.7))), 0.);
  vec3 col = mix(cyan, coral, smoothstep(0.0, 0.35, vD + fres * 0.6));
  col *= 0.65 + 0.45 * diff;
  col = mix(col, cream, pow(diff, 24.) * 0.6);
  gl_FragColor = vec4(col, 1.);
}`;

const blob = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1, 64),
  new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader })
);
scene.add(blob);

// ---------- Overlay SVG ----------
const svg = document.getElementById('ui');
const threadsG = document.getElementById('threads');
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
let W, H, cx, cy, R;
const ring = svg.insertBefore(el('circle', { fill:'none', stroke:'var(--line)', 'stroke-width':1.5 }), threadsG);
const axes = [], handles = [], labels = [];
TEMAS.forEach(() => {
  axes.push(svg.insertBefore(el('line', { stroke:'var(--line)', 'stroke-width':1 }), threadsG));
  handles.push(svg.insertBefore(el('circle', { r:6, fill:'var(--dot)', stroke:'var(--line)', 'stroke-width':2 }), threadsG));
  labels.push(svg.appendChild(el('text', {})));
});

function layout() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  cx = W / 2; cy = H * 0.38; R = Math.min(W * 0.22, H * 0.24);
  ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('r', R * 0.45);
  camera.setViewOffset(W, H, 0, (H / 2 - cy), W, H);          // centra el blob en el hexágono
  blob.scale.setScalar(1.63 * R / H);                         // radio ≈ anillo interior
}
addEventListener('resize', layout); layout();

const axisAngle = i => -(Math.PI / 2 + i * Math.PI / 3);      // ángulo en pantalla (y hacia abajo)
// cada opinión tiene un lugar fijo en un arco al final del eje de su tema
const SLOT = {};
TEMAS.forEach((_, t) => { const ids = byTema(t); ids.forEach((id, j) => SLOT[id] = { t, off: (j - (ids.length - 1) / 2) * 0.15 }); });
const slotXY = id => { const s = SLOT[id], a = axisAngle(s.t) + s.off; return [cx + Math.cos(a) * R * 1.02, cy + Math.sin(a) * R * 1.02]; };

// ---------- Respuestas → blob ----------
const clock = new THREE.Clock();
const counts = [0, 0, 0, 0, 0, 0], targets = [0, 0, 0, 0, 0, 0], pulseAt = [-99, -99, -99, -99, -99, -99];
let targetAmp = 0.03;
function addResponse(i) {
  counts[i]++;
  const max = Math.max(...counts), total = counts.reduce((a, b) => a + b, 0);
  counts.forEach((c, j) => targets[j] = c / max);
  targetAmp = 0.03 + (total / OPINIONES.length) * 0.07;
  pulseAt[i] = clock.getElapsedTime();
}

// ---------- Puntos (uno por opinión) ----------
const dots = {};   // id → { el, born }
function addDot(o) {
  const [id, , , tono] = o;
  const c = el('circle', { r:5, class:'op', fill:`var(--t-${tono})` });
  c.addEventListener('click', () => showOpinion(id));
  svg.appendChild(c);
  dots[id] = { el:c, born:clock.getElapsedTime() };
}

// ---------- Tarjeta ----------
const $ = id => document.getElementById(id);
const tonoTxt = { neg:'negativo', neu:'neutro', pos:'positivo' };
function showOpinion(id, fromPlayback) {
  const [, who, tema, tono, quote] = OPINIONES[id - 1];
  if (!fromPlayback) { stopTimers(); $('toggle').textContent = idx < OPINIONES.length ? 'Seguir' : 'Lecturas'; }
  Object.entries(dots).forEach(([k, d]) => d.el.classList.toggle('sel', +k === id));
  $('tag').textContent = `${TEMAS[tema]} · tono ${tonoTxt[tono]}`;
  $('who').textContent = who;
  $('quote').textContent = quote;
}
function setProgress(n, total) {
  $('count').textContent = `${n}/${total}`;
  $('prog').firstElementChild.style.width = `${n / total * 100}%`;
}

// ---------- Fase 1: reproducción ----------
let idx = 0, timer = null, stepTimer = null, mode = 'play', step = -1;
const stopTimers = () => { clearInterval(timer); clearInterval(stepTimer); timer = stepTimer = null; };
function nextOpinion() {
  if (idx >= OPINIONES.length) return startLecturas();
  const o = OPINIONES[idx++];
  addResponse(o[2]); addDot(o); showOpinion(o[0], true);
  setProgress(idx, OPINIONES.length);
}
function play() { mode = 'play'; $('toggle').textContent = 'Pausa'; $('prev').hidden = $('next').hidden = true; nextOpinion(); timer = setInterval(nextOpinion, 2600); }

// ---------- Fase 2: lecturas (hilos entre opiniones) ----------
let activeLinks = [], hiAxes = new Set();
function showLectura(s) {
  step = (s + LECTURAS.length) % LECTURAS.length;
  const L = LECTURAS[step], ids = new Set(L.ids);
  $('tag').textContent = `Lectura ${step + 1} de ${LECTURAS.length}`;
  $('who').innerHTML = `<b>${L.t}</b>`;
  $('quote').textContent = L.d;
  setProgress(step + 1, LECTURAS.length);
  Object.entries(dots).forEach(([k, d]) => { d.el.classList.toggle('dim', !ids.has(+k)); d.el.classList.remove('sel'); });
  hiAxes = new Set(L.axes || []);
  threadsG.replaceChildren();
  activeLinks = [];
  if (L.link) L.ids.slice(1).forEach((id, j) => {
    const p = threadsG.appendChild(el('path', { class:'thread', pathLength:1 }));
    p.style.animationDelay = `${j * 0.25}s`;
    activeLinks.push([L.ids[j], id, p]);
  });
}
function startLecturas() {
  stopTimers(); mode = 'read';
  $('prev').hidden = $('next').hidden = false;
  $('toggle').textContent = 'Repetir';
  showLectura(0);
  stepTimer = setInterval(() => showLectura(step + 1), 8000);
}
$('prev').onclick = () => { stopTimers(); showLectura(step - 1); };
$('next').onclick = () => { stopTimers(); showLectura(step + 1); };
$('toggle').onclick = () => {
  if (mode === 'read' && $('toggle').textContent === 'Lecturas') { startLecturas(); return; }
  if (mode === 'read') {                                      // repetir desde cero
    stopTimers(); idx = 0; counts.fill(0); targets.fill(0); targetAmp = 0.03;
    Object.values(dots).forEach(d => d.el.remove()); for (const k in dots) delete dots[k];
    threadsG.replaceChildren(); activeLinks = []; hiAxes = new Set(); play();
  } else if (timer) { stopTimers(); $('toggle').textContent = 'Seguir'; }
  else play();
};
setTimeout(play, 800);

// ---------- Cursor magnético (sutil) ----------
let mouse = { x:0, y:0, near:0 };
addEventListener('pointermove', e => {
  const dx = (e.clientX - cx) / R, dy = (e.clientY - cy) / R;
  mouse = { x:dx, y:-dy, near: Math.max(0, 1 - Math.hypot(dx, dy) / 1.4) };
});

// ---------- Loop ----------
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease = x => 1 - Math.pow(1 - Math.min(1, x), 3);
(function tick() {
  const now = clock.getElapsedTime();
  const t = now * (reduce ? 0.2 : 1);
  uniforms.uTime.value = t;
  const v = uniforms.uVals.value;
  v.forEach((_, i) => v[i] += (targets[i] - v[i]) * 0.04);
  uniforms.uAmp.value += (targetAmp - uniforms.uAmp.value) * 0.02;
  uniforms.uPulse.value.forEach((_, i) => {
    const age = now - pulseAt[i];
    uniforms.uPulse.value[i] = reduce ? 0 : Math.exp(-age * 3) * Math.sin(age * 14);
  });
  uniforms.uMouse.value.lerp(new THREE.Vector3(mouse.x, mouse.y, 0.6).normalize(), 0.05);
  uniforms.uPull.value += (mouse.near - uniforms.uPull.value) * 0.04;
  blob.rotation.y = Math.sin(t * 0.08) * 0.1;

  const narrow = W < 960;                                      // nombres cortos si no caben
  handles.forEach((h, i) => {
    const a = axisAngle(i), c = Math.cos(a), s = Math.sin(a), r = R * (0.45 + 0.55 * v[i]);
    h.setAttribute('cx', cx + c * r); h.setAttribute('cy', cy + s * r);
    axes[i].setAttribute('x1', cx + c * R * 0.45); axes[i].setAttribute('y1', cy + s * R * 0.45);
    axes[i].setAttribute('x2', cx + c * R);        axes[i].setAttribute('y2', cy + s * R);
    const L = labels[i], lr = R + 34;
    L.setAttribute('x', cx + c * lr); L.setAttribute('y', cy + s * lr + (s < -0.5 ? -2 : s > 0.5 ? 12 : 4));
    L.setAttribute('text-anchor', c > 0.3 ? 'start' : c < -0.3 ? 'end' : 'middle');
    L.textContent = `${(narrow ? TEMAS_CORTO : TEMAS)[i]} · ${counts[i]}`;
    L.classList.toggle('on', now - pulseAt[i] < 1.5 || hiAxes.has(i));
  });

  // puntos: vuelan desde la tarjeta hasta su lugar en el arco del tema
  for (const id in dots) {
    const d = dots[id], k = reduce ? 1 : ease((now - d.born) / 1.1), [tx, ty] = slotXY(+id);
    const sx = cx, sy = H - 90;
    d.el.setAttribute('cx', sx + (tx - sx) * k);
    d.el.setAttribute('cy', sy + (ty - sy) * k - Math.sin(k * Math.PI) * 40);   // pequeño arco en el vuelo
  }
  // hilos: curvas entre opiniones, tiradas hacia el centro
  activeLinks.forEach(([a, b, p]) => {
    const [ax, ay] = slotXY(a), [bx, by] = slotXY(b);
    const qx = (ax + bx) / 2 + (cx - (ax + bx) / 2) * 0.7, qy = (ay + by) / 2 + (cy - (ay + by) / 2) * 0.7;
    p.setAttribute('d', `M${ax},${ay} Q${qx},${qy} ${bx},${by}`);
  });

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
