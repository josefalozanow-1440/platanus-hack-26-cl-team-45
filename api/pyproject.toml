[project]
name = "comite-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28.1",
    "anthropic>=2.12.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
# Defaults plus the rules revi-mono fails the build on (ADR-0021).
select = ["E", "F", "I", "B", "UP", "ANN401", "C901", "ERA001", "G004", "N", "PLC0415", "PLR0915", "PLR1702", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]
