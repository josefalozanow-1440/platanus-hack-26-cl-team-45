# Render Blueprint: free plan for the api, the web and Postgres.
# Create it once in Render with New > Blueprint pointing at this repo.
services:
  - type: web
    name: comite-ds49-api
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: comite-ds49-db
          property: connectionString
      - key: KAPSO_API_KEY
        sync: false
      - key: KAPSO_PHONE_NUMBER_ID
        sync: false
      - key: KAPSO_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  - type: web
    name: comite-ds49-web
    runtime: docker
    plan: free
    rootDir: web
    dockerfilePath: ./Dockerfile
    envVars:
      # Free services can't receive private network traffic, so the web calls the api's public URL.
      # If Render gives the api another subdomain, update this value.
      - key: API_URL
        value: https://comite-ds49-api.onrender.com

databases:
  - name: comite-ds49-db
    plan: free
    databaseName: comite
    user: comite
